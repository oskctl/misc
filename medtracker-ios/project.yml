# XcodeGen fallback — only needed if MedTracker.xcodeproj won't open in your Xcode.
#   brew install xcodegen && cd medtracker-ios && xcodegen
name: MedTracker
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MedTracker:
    type: application
    platform: iOS
    sources: [MedTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MedTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: MedTracker uses Face ID to unlock your medication data.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
